<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a1018" />
  <title>Operator Workspace — Standalone</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">◈</div><div><strong id="brandName">Operator Workspace</strong><span>Standalone local console</span></div></div>
      <div class="local-badge"><i></i><span data-i18n="labels.synced">Local workspace</span></div>
      <nav id="nav" class="nav" aria-label="Workspace navigation">
        <button class="nav-item active" data-view="command"><span>⌁</span><span data-i18n="nav.command">Command center</span></button>
        <button class="nav-item" data-view="tools"><span>◫</span><span data-i18n="nav.tools">Tool deck</span></button>
        <button class="nav-item" data-view="event"><span>⚑</span><span data-i18n="nav.event">Event planner</span></button>
        <button class="nav-item" data-view="creative"><span>✦</span><span data-i18n="nav.creative">Creative lab</span></button>
        <button class="nav-item" data-view="learning"><span>▣</span><span data-i18n="nav.learning">Learning</span></button>
        <button class="nav-item" data-view="guide"><span>?</span><span data-i18n="nav.guide">Guide / ask</span></button>
      </nav>
      <div class="sidebar-footer"><div class="guardrail"><b>GUARDRAIL</b><p>Keep authorization, boundaries, stop conditions, and evidence visible before action.</p></div><div class="version">Standalone build · local JSON data</div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="eyebrow">Local operating system</span><h1 id="pageTitle">Own the system. Shape the work.</h1></div><div class="top-actions"><label class="select-label">Language <select id="localeSelect"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></label><button id="safeToggle" class="toggle on" aria-pressed="true"><span></span><b data-i18n="labels.safe">Safe mode</b></button><button id="advancedToggle" class="toggle on" aria-pressed="true"><span></span><b data-i18n="labels.advanced">Advanced</b></button></div></header>
      <div id="app" class="content" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
